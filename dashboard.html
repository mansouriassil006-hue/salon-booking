<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | BARBER WOLF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    <img src="logo.png" alt="Barber Wolf Logo" class="logo-img">
    <div class="logo">BARBER <span>WOLF</span></div>
    <button id="logoutBtn" class="btn-logout">خروج</button>
  </div>

  <div class="container">

    <div class="card hero-card">
      <h1 id="welcomeTitle">BARBER WOLF</h1>
      <p class="subtitle" id="welcomeSubtitle">جاري التحميل...</p>
    </div>

    <!-- Day Off Section -->
    <div class="card" id="dayoffCard">
      <h2 class="section-title">تعطيل الأيام (Day Off)</h2>

      <div class="field-group">
        <label>اختر التاريخ</label>
        <input type="date" id="dayoffDateInput" class="input-field" dir="ltr">
      </div>

      <button id="addDayoffBtn" class="btn-gold">تعطيل هذا اليوم</button>
      <div id="dayoffMessage" class="message-box"></div>

      <div id="dayoffListSection" style="margin-top:20px;">
        <h3 style="color:#b8b8b8; font-size:14px; margin-bottom:10px;">الأيام المعطلة القادمة</h3>
        <div id="dayoffListContainer">
          <p class="note">جاري التحميل...</p>
        </div>
      </div>
    </div>

    <!-- Bookings Section -->
    <div class="card">
      <div class="section-header">
        <h2 class="section-title">حجوزات اليوم</h2>
        <button id="refreshBtn" class="btn-refresh">🔄 تحديث</button>
      </div>
      <div id="bookingsContainer">
        <p class="note">جاري تحميل الحجوزات...</p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
