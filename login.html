<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | BARBER WOLF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    <img src="logo.png" alt="Barber Wolf Logo" class="logo-img">
    <div class="logo">BARBER <span>WOLF</span></div>
  </div>

  <div class="container">

    <div class="card hero-card">
      <h1>لوحة التحكم</h1>
      <p class="subtitle">تسجيل الدخول للإدارة أو الحلاقين</p>
    </div>

    <div class="card">
      <div class="field-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="emailInput" class="input-field" placeholder="example@email.com" dir="ltr">
      </div>

      <div class="field-group">
        <label>كلمة المرور</label>
        <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" dir="ltr">
      </div>

      <button id="loginBtn" class="btn-gold">تسجيل الدخول</button>

      <div id="loginMessage" class="message-box"></div>
    </div>

    <div class="footer-links">
      <a href="index.html">العودة للحجز</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
